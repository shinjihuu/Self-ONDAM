name: AI 연결 점검 (Hugging Face)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hugging Face 토큰·모델 점검
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/ai_check.py
